name: build

# Every push: JVM tests (~30 s).
# Native binaries (Windows, macOS, Linux): only for pull requests, on master,
# for tags and manually. Except for tags in quick mode (-Ob); tags
# (releases) are built fully optimized.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - run: clojure -M:test
      - name: Desktop UI (SWT, virtual display)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgtk-3-0 >/dev/null
          xvfb-run -a clojure -M:swt-linux:run gui --smoke 500

  native:
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: GTK/Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgtk-3-0 >/dev/null
      - name: native-image
        run: clojure -T:build native :quick ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Smoke test
        shell: bash
        run: |
          # every command must finish quickly (catches hanging processes);
          # own function because macOS has no timeout. stdin is passed through.
          t() { "$@" <&0 & p=$!; ( sleep 30; kill $p 2>/dev/null ) & w=$!; r=0; wait $p || r=$?; kill $w 2>/dev/null || true; return $r; }
          T=t
          # on Windows: cljpass.com = console program, cljpass.exe = GUI
          if [ -f target/cljpass.com ]; then cp target/cljpass.com target/cljpass-cli.exe; B=./target/cljpass-cli.exe; else B=./target/cljpass; fi
          $T $B help | head -3
          # UI language: CLJPASS_LANG selects German or English
          $T env CLJPASS_LANG=de $B help > "$RUNNER_TEMP/help-de.txt"
          $T env CLJPASS_LANG=en $B help > "$RUNNER_TEMP/help-en.txt"
          grep -q 'Benutzer:' "$RUNNER_TEMP/help-de.txt"
          ! grep -q 'Users:' "$RUNNER_TEMP/help-de.txt" || exit 1
          grep -q 'Users:' "$RUNNER_TEMP/help-en.txt"
          ! grep -q 'Benutzer:' "$RUNNER_TEMP/help-en.txt" || exit 1
          $B server --db "$RUNNER_TEMP/srv.db" --port 18080 --bind 127.0.0.1 --init-token T &
          sleep 2
          export CLJPASS_HOME="$RUNNER_TEMP/home"
          $T $B init --server http://127.0.0.1:18080 --org Test --init-token T --user ci --recovery-out "$RUNNER_TEMP/rec.json"
          $T $B status
          # KeePass round trip: export and re-import (password via stdin)
          echo "secret" | $T $B kdbx-export "$RUNNER_TEMP/export.kdbx"
          echo "secret" | $T $B kdbx-import "$RUNNER_TEMP/export.kdbx"
          # KeePass XML, CSV and XSL template (Saxon in the native binary)
          $T $B export "$RUNNER_TEMP/export.xml"
          $T $B import "$RUNNER_TEMP/export.xml"
          printf 'Title,Username,Password,Group\nCI,ci,pw,Test\n' > "$RUNNER_TEMP/in.csv"
          $T $B import "$RUNNER_TEMP/in.csv"
          $T $B export "$RUNNER_TEMP/export.csv"
          grep -q '"CI","ci","pw"' "$RUNNER_TEMP/export.csv"
          printf '<xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform"><xsl:output method="text"/><xsl:template match="/"><xsl:value-of select="count(//Entry)"/></xsl:template></xsl:stylesheet>' > "$RUNNER_TEMP/n.xsl"
          $T $B export "$RUNNER_TEMP/n.txt" --format xsl --xsl "$RUNNER_TEMP/n.xsl"
          cat "$RUNNER_TEMP/n.txt"; echo
          $T $B list
      - name: Desktop UI (native binary)
        shell: bash
        # macOS: SWT needs the first thread; result is informational only
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a ./target/cljpass gui --smoke 800
          elif [ "$RUNNER_OS" = "Windows" ]; then ./target/cljpass-cli.exe gui --smoke 800
          else ./target/cljpass gui --smoke 800; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cljpass-${{ runner.os }}
          path: |
            target/cljpass
            target/cljpass.exe
            target/cljpass.com
          if-no-files-found: error
